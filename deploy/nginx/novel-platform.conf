# =============================================================
#  基于 Python 的轻量化 Web 小说平台 —— Nginx 站点配置（单机部署）
#  放置：/etc/nginx/conf.d/novel-platform.conf
#  用法：sudo nginx -t && sudo systemctl reload nginx
#
#  结构：
#    浏览器 ──80──> Nginx ──┬── /            静态文件（frontend/dist）
#                           ├── /api/       反代 uvicorn:8000
#                           └── /static/    反代 uvicorn:8000（用户上传的封面/头像）
# =============================================================

upstream novel_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen      80;
    server_name _;

    # 前端构建产物目录（npm run build 的输出）
    root  /opt/novel-platform/frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;          # 与后端 MAX_UPLOAD_SIZE_MB 保持一致

    access_log /var/log/nginx/novel-access.log;
    error_log  /var/log/nginx/novel-error.log warn;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ---------- 接口反向代理 ----------
    location /api/ {
        proxy_pass         http://novel_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # 关键：把真实来源 IP 传给应用。
        # 应用只信任 TRUSTED_PROXIES 里的直连地址（默认 127.0.0.1），
        # 所以这里必须同时设置 X-Real-IP，否则限流会把全站算成同一个 IP。
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 应用到业务层统一返回 JSON，这里不要再套错误页
        proxy_intercept_errors off;
    }

    # ---------- 用户上传的静态资源 ----------
    location /static/ {
        proxy_pass http://novel_api;
        proxy_set_header Host $host;

        # 封面/头像文件名里带时间戳时可直接长缓存；当前按 7 天
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 带 hash 的构建产物：一年强缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA 兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须每次校验，否则前端发版后用户看到旧壳
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 隐藏文件（.git / .env 等）一律拒绝
    location ~ /\. {
        deny all;
    }
}
